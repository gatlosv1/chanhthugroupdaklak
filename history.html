<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch sử thao tác</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/history.css" />
  </head>
  <body>
    <div class="history-shell">
      <main class="history-main container-fluid p-3 p-lg-4">
        <header class="history-toolbar d-flex flex-column flex-md-row justify-content-between gap-3 pb-3 mb-3">
          <div><div class="small text-secondary">Production Data / realtime</div><h1 class="h3 mb-0">Lịch sử thao tác</h1></div>
          <div class="d-flex align-items-center gap-3"><span id="historyStatus" class="history-status">Đang kết nối...</span><button class="btn btn-sm btn-outline-light" id="exportHistoryBtn">Tải CSV</button><button class="btn btn-sm btn-outline-danger d-none" id="cleanupHistoryBtn">Xóa log cũ</button><a class="btn btn-sm btn-outline-secondary" href="./dashboard.html">Dashboard</a></div>
        </header>
        <div id="oldLogsBanner" class="alert alert-warning d-none py-2" role="alert">Có log cũ hơn 7 ngày. Hãy tải về rồi xóa để tiết kiệm dung lượng. <button class="btn btn-sm btn-warning ms-2" id="exportOldHistoryBtn">Tải log cũ</button></div>
        <section class="history-grid">
          <div class="log-panel log-panel--primary">
            <div class="log-panel-header px-3 py-2 border-bottom">LIVE STREAM // logs/<span id="currentDate">----</span></div>
            <div id="historyBody" class="log-stream" role="log" aria-live="polite"><div class="text-secondary p-3">Đang chờ log...</div></div>
          </div>

          <aside class="log-panel log-panel--detail">
            <div class="log-panel-header px-3 py-2 border-bottom">DETAIL // selected event</div>
            <div id="historyDetail" class="history-detail">
              <div class="empty-detail">Chọn một dòng log ở bên trái để xem chi tiết thay đổi.</div>
            </div>
          </aside>
        </section>
      </main>
    </div>
    <script type="module" src="./js/history.js"></script>
  </body>
</html>
