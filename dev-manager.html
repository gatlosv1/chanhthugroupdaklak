<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Manager - Production Data Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f8fafc',
                100: '#eef2ff',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8'
              }
            },
            boxShadow: {
              soft: '0 10px 30px rgba(15, 23, 42, 0.10)'
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <div class="d-flex min-vh-100">
      <aside class="sidebar bg-dark text-white p-4">
        <div class="mb-4">
          <h2 class="h5 fw-bold">Production Data</h2>
          <p class="text-secondary small mb-0">Quản lý sản xuất</p>
        </div>

        <nav class="nav flex-column gap-2">
          <a class="nav-link" href="./dashboard.html">Dashboard</a>
          <a class="nav-link" href="./profile.html" data-page="profile">Profile</a>
          <a class="nav-link" href="./label.html" data-page="label">In Nhãn</a>
          <a class="nav-link" href="./production.html" data-page="production">Phần trăm BTP</a>
          <a class="nav-link" href="./nhap-lieu-san-xuat.html" data-page="nhapLieuSanXuat">Năng suất sản xuất</a>
          <a class="nav-link" href="./report.html" data-page="report">Báo cáo</a>
          <a class="nav-link" href="./cong-tach-mui.html" data-page="congTachMui">Năng xuất tách múi</a>
          <a class="nav-link" href="./settings.html" data-page="settings">⚙ Quản lý danh mục</a>
          <a class="nav-link active" href="./dev-manager.html" data-page="devManager">Developer Manager</a>
          <a class="nav-link" href="#" data-action="logout">Đăng xuất</a>
        </nav>
      </aside>

      <main class="flex-grow-1 bg-light p-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <p class="text-muted mb-1">Xin chào</p>
            <h1 class="h3 fw-bold mb-0" id="dashboardGreeting">Developer Manager</h1>
          </div>
          <div class="d-flex align-items-center gap-3">
            <div class="text-end">
              <p class="mb-0 fw-semibold" id="currentUserName">-</p>
              <p class="small text-muted mb-0" id="currentUserEmail">-</p>
            </div>
            <div class="avatar-circle" id="avatarPreview">D</div>
          </div>
        </header>

        <section class="card border-0 shadow-sm rounded-4 mb-4">
          <div class="card-body">
            <h2 class="h5 fw-semibold mb-3">Quản lý trạng thái các trang</h2>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th>Trang</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="pageAccessTableBody"></tbody>
              </table>
            </div>
            <div class="mt-3 text-end">
              <button type="button" class="btn btn-primary" id="savePageAccessBtn">Lưu cấu hình</button>
            </div>
          </div>
        </section>

        <section class="card border-0 shadow-sm rounded-4">
          <div class="card-body">
            <h2 class="h5 fw-semibold mb-3">Tạo tài khoản DEV</h2>
            <form id="createDevForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="devEmail">Email</label>
                <input id="devEmail" type="email" class="form-control" required placeholder="dev@company.com" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="devPassword">Mật khẩu</label>
                <input id="devPassword" type="text" class="form-control" value="Meocutephomaique2005" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="devName">Tên hiển thị</label>
                <input id="devName" type="text" class="form-control" placeholder="Developer" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="devRole">Quyền</label>
                <select id="devRole" class="form-select">
                  <option value="dev" selected>Dev</option>
                  <option value="admin">Admin</option>
                  <option value="staff">Staff</option>
                </select>
              </div>
              <div class="col-12 d-flex gap-2 align-items-center">
                <button type="submit" class="btn btn-danger">Tạo tài khoản DEV</button>
                <span id="devStatus" class="small text-muted"></span>
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/devManager.js"></script>
    <script type="module" src="./js/logout.js"></script>
  </body>
</html>
